<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Scoop Ice Cream | Order</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
        <header>
            <img src="logo.jpeg"/>
            <h1>Sweet Scoops Ice Cream</h1>
        </header>

    <div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li class="divider">|</li>
          <li><a href="menu_view.html">Menu</a></li>
        </ul>
      </nav>
    </div>

    <main class="main-container">
      <img class="banner" src="Picture2.jpeg" alt="Ice cream banner" />

      <form class="order-form">
        <h2>Vanilla Dream</h2>
        <p class="subheading">Choose Type</p>

        <input type="radio" id="cup" name="vanillaType" value="cup" />
        <br>
        <label for="cup">Cup</label>
        <br />

        <input type="radio" id="cone" name="vanillaType" value="cone" />
        <br>
        <label for="cone">Cone</label>
        <br /><br />

        <button type="button" class="btn secondary">Submit Selection</button>

        <br /><br /><br />

        <h2>Chocolate Bliss</h2>
        <p class="subheading">Select Toppings</p>

        <input type="checkbox" id="sprinkles" name="toppings" value="sprinkles" />
        <br>
        <label for="sprinkles">Sprinkles</label>
        <br />

        <input type="checkbox" id="nuts" name="toppings" value="nuts" />
        <br>
        <label for="nuts">Nuts</label>
        <br />

        <input type="checkbox" id="caramel" name="toppings" value="caramel" />
        <br>
        <label for="caramel">Caramel</label>
        <br /><br />

        <button type="button" class="btn secondary">Submit Selection</button>

        <br /><br />

        <a class="btn primary" href="order_summary.html">Finish Order</a>
      </form>
    </main>

    <footer class="site-footer">
      <p>© 2026 Sweet Scoop Ice Cream</p>
    </footer>
  </body>
</html>
